[package]
name = "quicmonoio"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tikv-jemallocator = "0.6"
monoio = "0.2"
quinn-proto = "0.11"
bytes = "1"
socket2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log", "bloom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
debug = 1

# No panic = "abort": main relies on catch_unwind to report a core panic.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"
incremental = false
